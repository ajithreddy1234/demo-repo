name: Build CE4400 Final Project

on:
  push:
    paths:
      - "Irrigation-Water-Demand-ML/src/build_week2.py"
      - "Irrigation-Water-Demand-ML/src/build_final.py"
      - "Irrigation-Water-Demand-ML/src/allocation_from_iwr.py"
      - "Irrigation-Water-Demand-ML/src/reservoir_optimizer.py"
      - "Irrigation-Water-Demand-ML/src/singur_case_study.py"
      - "Irrigation-Water-Demand-ML/tests/**"
      - "Irrigation-Water-Demand-ML/config/**"
      - "Irrigation-Water-Demand-ML/requirements.txt"
      - ".github/workflows/irrigation_final.yml"

concurrency:
  group: ce4400-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Irrigation-Water-Demand-ML/requirements.txt

      - name: Run project sanity tests
        run: python -m unittest discover -s Irrigation-Water-Demand-ML/tests -p "test_*.py"

      - name: Rebuild validated dataset
        run: python Irrigation-Water-Demand-ML/src/build_week2.py

      - name: Train final models and evaluate 2025
        run: python Irrigation-Water-Demand-ML/src/build_final.py

      - name: Build Singur case-study scale check and 10-day working table
        run: python Irrigation-Water-Demand-ML/src/singur_case_study.py

      - name: Optimize reservoir release under constrained-water stress test
        run: python Irrigation-Water-Demand-ML/src/reservoir_optimizer.py --area-ha 1000 --overall-efficiency 0.70 --available-fraction 0.85 --daily-cap-factor 1.40

      - name: Commit generated project outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Irrigation-Water-Demand-ML/data Irrigation-Water-Demand-ML/figures Irrigation-Water-Demand-ML/results Irrigation-Water-Demand-ML/reports Irrigation-Water-Demand-ML/models
          if ! git diff --cached --quiet; then
            git commit -m "Generate final CE4400 project results"
          fi
          git pull --rebase origin main
          git push origin main
